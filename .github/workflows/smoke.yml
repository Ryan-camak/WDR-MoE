name: WDR-MoE smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile entry points
        run: python -m compileall -q train.py val.py ultralytics/nn/modules/moe
      - name: Test wavelet experts
        run: python test_wavelet_moe.py
      - name: Build WDR-MoE
        run: >-
          python -c "from ultralytics import YOLO;
          m=YOLO('ultralytics/cfg/models/master/v0_1/det/yolo-master-n-fixwavelet.yaml');
          print(sum(p.numel() for p in m.model.parameters()))"
